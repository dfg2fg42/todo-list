<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-Do List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --surface2: #f8fafc;
      --border: #e2e8f0;
      --accent: #4361ee;
      --accent-hover: #3451d1;
      --danger: #e53e3e;
      --danger-hover: #c53030;
      --success: #38a169;
      --text: #1a202c;
      --text-muted: #718096;
      --shadow: 0 1px 4px rgba(0,0,0,0.08), 0 4px 16px rgba(0,0,0,0.06);
      --radius: 14px;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', '맑은 고딕', sans-serif;
      min-height: 100vh;
      padding: 32px 16px;
      word-break: keep-all;
    }

    .app-wrap { max-width: 1100px; margin: 0 auto; }
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px;
    }
    .app-header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; color: var(--accent); }
    .app-header .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 3px; }

    .main-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: start;
    }

    .card {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 24px; border: 1px solid var(--border);
    }
    .card-title {
      font-size: 13px; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 18px; display: flex; align-items: center; gap: 7px;
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .form-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .form-group input,
    .form-group textarea,
    .form-group select {
      padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 9px;
      font-size: 13px; font-family: inherit; color: var(--text);
      background: var(--surface2); outline: none; transition: border-color .18s;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus { border-color: var(--accent); background: #fff; }
    .form-group textarea { resize: vertical; min-height: 70px; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 9px 18px; border-radius: 9px; font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; transition: all .16s; font-family: inherit;
      white-space: nowrap;
    }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-ghost { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: #a0aec0; color: var(--text); }
    .btn-danger  { background: var(--danger);  color: #fff; }
    .btn-danger:hover  { background: var(--danger-hover); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-sm { padding: 5px 11px; font-size: 12px; border-radius: 7px; }

    .noti-banner {
      display: flex; align-items: center;
      background: #ebf8ff; border: 1px solid #bee3f8; border-radius: 9px;
      padding: 9px 14px; font-size: 12px; color: #2b6cb0; margin-bottom: 14px;
    }
    .noti-banner.warn { background: #fffbeb; border-color: #fbd38d; color: #744210; }
    .noti-banner.ok   { background: #f0fff4; border-color: #9ae6b4; color: #276749; }

    /* ── Filter Bar ── */
    .filter-bar {
      display: flex; gap: 8px; align-items: end; flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .filter-bar .form-group { margin-bottom: 0; }
    .filter-bar select,
    .filter-bar input { background: var(--surface); font-size: 12px; padding: 7px 8px; }
    .fg-year   { width: 100px; }
    .fg-month  { width: 80px; }
    .fg-date   { width: 160px; }
    .fg-status { width: 100px; }

    /* ── Stats ── */
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
    .stat-box {
      background: var(--surface2); border-radius: 10px;
      border: 1px solid var(--border); padding: 12px 14px; text-align: center;
    }
    .stat-box .val { font-size: 26px; font-weight: 800; color: var(--accent); }
    .stat-box .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* ── View toggle row ── */
    .view-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .view-toggle {
      display: flex; gap: 0;
      border: 1.5px solid var(--border); border-radius: 9px; overflow: hidden;
    }
    .view-toggle button {
      padding: 7px 18px; font-size: 13px; font-weight: 600;
      border: none; background: var(--surface2); color: var(--text-muted);
      cursor: pointer; transition: all .16s; font-family: inherit;
    }
    .view-toggle button + button { border-left: 1.5px solid var(--border); }
    .view-toggle button.active { background: var(--accent); color: #fff; }

    /* ★ 정렬 셀렉트 — 뷰 토글 오른쪽에 작게 */
    .sort-select-wrap {
      display: flex; align-items: center; gap: 6px;
    }
    .sort-select-wrap label {
      font-size: 11px; font-weight: 600; color: var(--text-muted); white-space: nowrap;
    }
    .sort-select-wrap select {
      font-size: 12px; font-family: inherit; padding: 5px 8px;
      border: 1.5px solid var(--border); border-radius: 7px;
      background: var(--surface2); color: var(--text);
      outline: none; cursor: pointer; transition: border-color .18s;
    }
    .sort-select-wrap select:focus { border-color: var(--accent); }

    /* ── Bulk Bar ── */
    .bulk-bar {
      display: flex; gap: 6px; align-items: center;
      background: #eef2ff; border-radius: 9px;
      padding: 8px 12px; margin-bottom: 12px;
      font-size: 12px; color: var(--accent); font-weight: 600; flex-wrap: wrap;
    }
    .bulk-bar span { flex: 1; }

    /* ── Task list ── */
    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-card {
      background: var(--surface); border-radius: 12px; border: 1.5px solid var(--border);
      padding: 14px 16px; display: grid; grid-template-columns: auto 1fr auto;
      gap: 12px; align-items: start; transition: box-shadow .16s, border-color .16s;
    }
    .task-card:hover { box-shadow: 0 4px 16px rgba(67,97,238,.1); border-color: #c3d0fb; }
    .task-card.done-card { opacity: 0.6; }
    .task-card.done-card .task-title { text-decoration: line-through; color: var(--text-muted); }
    .task-card.selected-card { border-color: var(--accent); background: #f5f7ff; }

    .task-chk-wrap { display: flex; flex-direction: column; gap: 8px; align-items: center; padding-top: 2px; }
    .task-chk-wrap input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }

    .task-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
    .task-meta  { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
    .meta-tag {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 999px; padding: 2px 9px; color: var(--text-muted);
    }
    .meta-tag.rem    { background: #fef3c7; border-color: #fde68a; color: #92400e; }
    .meta-tag.period { background: #dbeafe; border-color: #bfdbfe; color: #1e40af; }
    .task-memo   { font-size: 13px; color: var(--text-muted); margin-bottom: 8px; white-space: pre-wrap; }
    .task-thumb  { width: 80px; height: 80px; border-radius: 9px; object-fit: cover; border: 1px solid var(--border); cursor: pointer; margin-bottom: 6px; }
    .task-actions { display: flex; gap: 6px; }
    .task-aside { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

    .badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
    .badge-todo { background: #edf2ff; color: var(--accent); }
    .badge-done { background: #f0fff4; color: var(--success); }
    .badge-over { background: #fff5f5; color: var(--danger); }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px; }
    .empty-state svg { opacity: 0.2; display: block; margin: 0 auto 16px; }

    /* ── Lightbox ── */
    .lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.75); z-index: 9999; align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 90vw; max-height: 90vh; border-radius: 12px; }
    .lightbox-close { position: absolute; top: 20px; right: 24px; color: #fff; font-size: 32px; cursor: pointer; line-height: 1; }

    /* ── Image preview ── */
    .img-preview-wrap { position: relative; display: inline-block; }
    .img-preview { width: 80px; height: 80px; object-fit: cover; border-radius: 9px; border: 1px solid var(--border); display: none; }
    .img-clear {
      position: absolute; top: -6px; right: -6px; background: var(--danger); color: #fff;
      border-radius: 50%; width: 20px; height: 20px; font-size: 13px; border: none;
      cursor: pointer; display: none; align-items: center; justify-content: center;
    }

    /* ── Toast ── */
    .toast-wrap { position: fixed; bottom: 32px; right: 32px; display: flex; flex-direction: column; gap: 10px; z-index: 9998; }
    .toast {
      background: #1a202c; color: #fff; padding: 12px 20px; border-radius: 10px;
      font-size: 13px; font-weight: 500; box-shadow: 0 4px 24px rgba(0,0,0,.18);
      animation: fadeSlide .3s ease; font-family: inherit;
    }
    @keyframes fadeSlide { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: none; } }


    /* ── Backup / Restore ── */
    .backup-bar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 10px 14px; background: #f0fdf4;
      border: 1px solid #bbf7d0; border-radius: 10px; margin-bottom: 0;
    }
    .backup-bar .bar-label {
      font-size: 12px; font-weight: 700; color: #166534; flex: 1; white-space: nowrap;
    }
    .btn-backup  { background: #16a34a; color: #fff; }
    .btn-backup:hover  { background: #15803d; }
    .btn-restore { background: #0ea5e9; color: #fff; }
    .btn-restore:hover { background: #0284c7; }

    ::-webkit-scrollbar { width: 6px; }

    /* ── Backup / Restore ── */
    .backup-bar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 10px 14px; background: #f0fdf4;
      border: 1px solid #bbf7d0; border-radius: 10px; margin-bottom: 0;
    }
    .backup-bar .bar-label {
      font-size: 12px; font-weight: 700; color: #166534; flex: 1; white-space: nowrap;
    }
    .btn-backup  { background: #16a34a; color: #fff; }
    .btn-backup:hover  { background: #15803d; }
    .btn-restore { background: #0ea5e9; color: #fff; }
    .btn-restore:hover { background: #0284c7; }

    ::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 9px; }
    .divider { height: 1px; background: var(--border); margin: 14px 0; }
    .panel-section { display: block; }
    .panel-section.hidden { display: none; }

    /* ════════════════════
       Calendar
    ════════════════════ */
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .cal-header h2 { font-size: 17px; font-weight: 800; }
    .cal-header-actions { display: flex; gap: 6px; }

    .cal-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; font-weight: 600; margin-bottom: 12px; }
    .cal-legend-item { display: flex; align-items: center; gap: 5px; color: var(--text-muted); }
    .cal-legend-dot { width: 10px; height: 10px; border-radius: 3px; }
    .dot-todo { background: #bfdbfe; }
    .dot-done { background: #bbf7d0; }
    .dot-over { background: #fecaca; }

    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-dow {
      text-align: center; font-size: 11px; font-weight: 700; color: var(--text-muted);
      padding: 6px 0; border-bottom: 1px solid var(--border); margin-bottom: 2px;
    }
    .cal-dow.dow-sun { color: #e53e3e; }
    .cal-dow.dow-sat { color: var(--accent); }

    .cal-cell {
      min-height: 82px; border-radius: 8px; border: 1px solid var(--border);
      padding: 5px 4px 4px; background: var(--surface2);
      cursor: pointer; transition: border-color .16s, background .16s; overflow: hidden;
    }
    .cal-cell:hover { border-color: var(--accent); background: #f5f7ff; }
    .cal-cell.other-month { opacity: 0.35; pointer-events: none; }
    .cal-cell.today { border-color: var(--accent); background: #eef2ff; }

    .cal-day-num {
      font-size: 12px; font-weight: 700; color: var(--text-muted);
      width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;
      border-radius: 50%; flex-shrink: 0;
    }
    .cal-cell.today  .cal-day-num { background: var(--accent); color: #fff !important; }
    .cal-cell.dow-sun .cal-day-num { color: #e53e3e; }
    .cal-cell.dow-sat .cal-day-num { color: var(--accent); }

    .cal-task-chip {
      font-size: 10px; font-weight: 600; padding: 2px 5px; border-radius: 4px;
      margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      display: block; cursor: pointer; transition: opacity .14s;
    }
    .cal-task-chip:hover { opacity: 0.75; }
    .chip-todo { background: #dbeafe; color: #1e40af; }
    .chip-done { background: #dcfce7; color: #166534; }
    .chip-over { background: #fee2e2; color: #991b1b; }
    .cal-more { font-size: 10px; color: var(--text-muted); font-weight: 600; margin-top: 2px; }


    /* ── Shift Badge ── */
    .shift-badge {
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 800;
      padding: 1px 4px; border-radius: 4px;
      letter-spacing: 0.5px; line-height: 1.5;
      white-space: nowrap; flex-shrink: 0;
    }
    .shift-ju  { background: #22c55e; color: #000; }
    .shift-hyu { background: #ffffff; color: #e53e3e; border: 1px solid #e53e3e; }
    .shift-ya  { background: #111111; color: #ffffff; }

    .cal-part-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 12px; flex-wrap: wrap;
    }
    .cal-part-row label {
      font-size: 12px; font-weight: 700; color: var(--text-muted); white-space: nowrap;
    }
    .cal-part-row select {
      font-size: 12px; font-family: inherit; padding: 5px 10px;
      border: 1.5px solid var(--border); border-radius: 7px;
      background: var(--surface2); color: var(--text);
      outline: none; cursor: pointer; transition: border-color .18s;
    }
    .cal-part-row select:focus { border-color: var(--accent); }

    .shift-legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; font-weight: 600; margin-left: auto; }
    .shift-legend-item { display: flex; align-items: center; gap: 4px; color: var(--text-muted); }

    /* ── Day Modal ── */
    .day-modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 8000; align-items: center; justify-content: center;
    }
    .day-modal-overlay.open { display: flex; }
    .day-modal {
      background: var(--surface); border-radius: var(--radius);
      box-shadow: 0 8px 40px rgba(0,0,0,.18); padding: 24px;
      width: 420px; max-width: 95vw; max-height: 85vh; overflow-y: auto;
    }
    .day-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .day-modal-header h3 { font-size: 16px; font-weight: 800; color: var(--accent); }
    .day-modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }
    .day-modal .task-item {
      padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border);
      margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start;
    }
    .day-modal .task-item-body { flex: 1; }
    .day-modal .task-item-title { font-size: 14px; font-weight: 700; margin-bottom: 3px; }
    .day-modal .task-item-meta { font-size: 11px; color: var(--text-muted); }
    .day-modal .task-item-memo {
      font-size: 12px; color: var(--text-muted);
      white-space: pre-wrap; word-break: break-all;
      margin-top: 5px; line-height: 1.6;
      background: var(--surface2); border-radius: 6px;
      padding: 6px 8px; border: 1px solid var(--border);
    }
    .day-modal .task-item.done-item { opacity: 0.6; }
    .day-modal .task-item.done-item .task-item-title { text-decoration: line-through; }
    .day-modal-empty { text-align: center; color: var(--text-muted); font-size: 14px; padding: 24px 0; }
    .day-modal-add { width: 100%; margin-top: 12px; }
  </style>
</head>
<body>
<div class="app-wrap">

  <!-- Header -->
  <div class="app-header">
    <div>
      <h1>✅ To-Do List</h1>
      <div class="subtitle" id="todayLabel"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;">
      <button class="btn btn-ghost btn-sm" onclick="requestNoti()">&#128276; 알림 권한 요청</button>
      <button class="btn btn-backup btn-sm" onclick="backupData()">&#128229; 백업</button>
      <label class="btn btn-restore btn-sm" style="cursor:pointer;margin:0;">
        &#128228; 복원
        <input type="file" id="restoreFile" accept=".json" style="display:none;" onchange="restoreData(this)" />
      </label>
    </div>
  </div>

  <div class="main-grid">

    <!-- LEFT: Form -->
    <div>
      <div class="card">
        <div class="card-title">
          <span id="formTitle">➕새 항목 추가</span>
        </div>

        <div id="notiBanner" class="noti-banner warn" style="display:none;"></div>

        <div class="form-group">
          <label>📒 할 일 제목 *</label>
          <input id="fTitle" type="text" placeholder="제목을 입력하세요" />
        </div>
        <div class="form-group">
          <label>📝 메모</label>
          <textarea id="fMemo" placeholder="상세 내용 입력..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>📅 기간 시작</label>
            <input id="fStart" type="date" />
          </div>
          <div class="form-group">
            <label>📅 기간 종료</label>
            <input id="fEnd" type="date" />
          </div>
        </div>
        <div class="form-group">
          <label>🔔 리마인더</label>
          <input id="fReminder" type="datetime-local" />
        </div>
        <div class="form-group">
          <label>🖼️ 이미지 첨부 (자동압축)</label>
          <input id="fImage" type="file" accept="image/*" onchange="onImageChange(this)" />
          <div class="img-preview-wrap" style="margin-top:8px;">
            <img id="imgPreview" class="img-preview" alt="미리보기" />
            <button class="img-clear" id="imgClearBtn" onclick="clearImage()">x</button>
          </div>
        </div>

        <div class="divider"></div>

        <button class="btn btn-primary" id="btnSave" onclick="saveTask()">💾 저장</button>
        <button class="btn btn-ghost" style="width:100%; margin-top:8px;" onclick="resetForm()">🗑️ 초기화</button>

      </div>
    </div>

    <!-- RIGHT: List + Calendar -->
    <div>
      <div class="card">

        <!-- Stats -->
        <div class="stats-row">
          <div class="stat-box">
            <div class="val" id="statTotal">0</div>
            <div class="lbl">전체</div>
          </div>
          <div class="stat-box">
            <div class="val" id="statDone" style="color:var(--success)">0</div>
            <div class="lbl">완료</div>
          </div>
          <div class="stat-box">
            <div class="val" id="statRemain" style="color:var(--danger)">0</div>
            <div class="lbl">미완료</div>
          </div>
        </div>

        <!-- View toggle + 정렬 -->
        <div class="view-row">
          <div class="view-toggle">
            <button id="btnListView" class="active" onclick="setView('list')">&#128203; 목록</button>
            <button id="btnCalView" onclick="setView('calendar')">&#128197; 달력</button>
          </div>
          <!-- ★ 정렬 셀렉트 — 오른쪽 작게 -->
          <div class="sort-select-wrap">
            <label for="filterSort">정렬</label>
            <select id="filterSort" onchange="filterList()">
              <option value="asc">오름차순🔼</option>
              <option value="desc">내림차순🔽</option>
            </select>
          </div>
        </div>

        <!-- LIST SECTION -->
        <div id="listSection" class="panel-section">

          <div class="filter-bar">
            <div class="form-group fg-year">
              <label style="text-align:center;">년도</label>
              <select id="filterYear" onchange="filterList()" style="text-align:center;"></select>
            </div>
            <div class="form-group fg-month">

<script>
const LS_KEY = "todo_app_ls_v1";

function lsLoad() {
  const d = localStorage.getItem(LS_KEY);
  return d ? JSON.parse(d) : [];
}
function lsSave(arr) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(arr)); }
  catch(e) { if(e.name==='QuotaExceededError') alert("저장소가 가득 찼습니다. 이미지를 삭제해 주세요."); }
}
async function idbAll() { return lsLoad(); }
async function idbPut(t) {
  const all = lsLoad();
  const i = all.findIndex(x=>x.id===t.id);
  if(i>=0) all[i]=t; else all.push(t);
  lsSave(all);
}
async function idbDel(id) { lsSave(lsLoad().filter(x=>x.id!==id)); }

let tasks=[], selectedIds=new Set(), editingId=null, currentImageDataUrl=null, imageCleared=false;
let currentView='list', calYear=new Date().getFullYear(), calMonth=new Date().getMonth(), dayModalDate=null;

function toast(msg,dur=2800){
  const w=document.getElementById("toastWrap");
  const el=document.createElement("div"); el.className="toast"; el.textContent=msg;
  w.appendChild(el); setTimeout(()=>el.remove(),dur);
}

async function requestNoti(){
  if(!("Notification" in window)){toast("이 브라우저는 알림을 지원하지 않습니다.");return;}
  const r=await Notification.requestPermission();
  updateNotiBanner();
  toast(r==="granted"?"알림 권한이 허용되었습니다.":"알림 권한: "+r);
}
function updateNotiBanner(){
  const b=document.getElementById("notiBanner");
  if(!("Notification" in window)){
    b.className="noti-banner warn";b.textContent="이 브라우저는 알림을 지원하지 않습니다.";b.style.display="";
  } else if(Notification.permission==="granted"){
    b.className="noti-banner ok";b.textContent="알림 권한이 허용되어 있습니다.";b.style.display="";
  } else if(Notification.permission==="denied"){
    b.className="noti-banner warn";b.textContent="알림이 차단되었습니다. 브라우저 설정에서 허용해 주세요.";b.style.display="";
  } else {
    b.className="noti-banner";b.textContent="리마인더 알림을 받으려면 [알림 권한 요청] 버튼을 클릭하세요.";b.style.display="";
  }
}
function checkReminders(){
  if(!("Notification" in window)||Notification.permission!=="granted") return;
  const now=Date.now();
  tasks.forEach(async t=>{
    if(t.done||t.reminded||!t.reminderAt) return;
    if(new Date(t.reminderAt).getTime()<=now){
      try{new Notification("ToDo 리마인더",{body:t.title});}catch(e){}
      t.reminded=true; await idbPut(t);
    }
  });
}

function onImageChange(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas");
      const MAX=800; let w=img.width,h=img.height;
      if(w>MAX){h*=MAX/w;w=MAX;}
      c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      currentImageDataUrl=c.toDataURL("image/jpeg",0.7);
      const p=document.getElementById("imgPreview"),b=document.getElementById("imgClearBtn");
      p.src=currentImageDataUrl;p.style.display="block";b.style.display="flex";
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(f);
}
function clearImage(){
  currentImageDataUrl=null;
  imageCleared=true;
  document.getElementById("fImage").value="";
  document.getElementById("imgPreview").style.display="none";
  document.getElementById("imgClearBtn").style.display="none";
}

function openLightbox(src){document.getElementById("lightboxImg").src=src;document.getElementById("lightbox").classList.add("open");}
function closeLightbox(){document.getElementById("lightbox").classList.remove("open");}

function parseDateOnly(s){return s?new Date(s+"T00:00:00"):null;}
function overlap(ts,te,fs,fe){
  const a=ts?ts.getTime():-Infinity,b=te?te.getTime():Infinity;
  const c=fs?fs.getTime():-Infinity,d=fe?fe.getTime():Infinity;
  return a<=d&&b>=c;
}
function isOverdue(t){
  if(t.done||!t.endDate) return false;
  return new Date(t.endDate+"T23:59:59")<new Date();
}
function fmtDate(d){
  if(!d) return "";
  const days=["일","월","화","수","목","금","토"];
  return d+"("+days[new Date(d+"T00:00:00").getDay()]+")";
}
function todayStr(){
  const n=new Date();
  return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
}
function makeDateStr(y,m,d){
  return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
}
function escHtml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function getTask(id){return tasks.find(t=>t.id===id);}

function buildYearSelect(){
  const sel=document.getElementById("filterYear");
  const now=new Date().getFullYear();
  for(let y=now-4;y<=now+4;y++){
    const o=document.createElement("option");
    o.value=y;o.textContent=y+"년";
    if(y===now) o.selected=true;
    sel.appendChild(o);
  }
}

function setView(v){
  currentView=v;
  document.getElementById("btnListView").classList.toggle("active",v==="list");
  document.getElementById("btnCalView").classList.toggle("active",v==="calendar");
  document.getElementById("listSection").classList.toggle("hidden",v!=="list");
  document.getElementById("calSection").classList.toggle("hidden",v!=="calendar");
  if(v==="calendar") renderCalendar();
}

function resetForm(){
  editingId=null;currentImageDataUrl=null;
  ["fTitle","fMemo","fStart","fEnd","fReminder"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("fImage").value="";
  document.getElementById("imgPreview").style.display="none";
  document.getElementById("imgClearBtn").style.display="none";
  document.getElementById("formTitle").textContent="새 항목 추가";
  document.getElementById("btnSave").textContent="저장";
}
function fillForm(t){
  if(!t) return;
  editingId=t.id;
  imageCleared=false;
  document.getElementById("fTitle").value=t.title||"";
  document.getElementById("fMemo").value=t.memo||"";
  document.getElementById("fStart").value=t.startDate||"";
  document.getElementById("fEnd").value=t.endDate||"";
  document.getElementById("fReminder").value=t.reminderAt||"";
  currentImageDataUrl=t.imageDataUrl||null;
  document.getElementById("fImage").value="";
  const p=document.getElementById("imgPreview"),b=document.getElementById("imgClearBtn");
  if(t.imageDataUrl){p.src=t.imageDataUrl;p.style.display="block";b.style.display="flex";}
  else{p.style.display="none";b.style.display="none";}
  document.getElementById("formTitle").textContent="항목 수정";
  document.getElementById("btnSave").textContent="업데이트";
  document.getElementById("fTitle").focus();
  window.scrollTo({top:0,behavior:"smooth"});
}
async function saveTask(){
  const title=document.getElementById("fTitle").value.trim();
  if(!title){toast("제목을 입력해 주세요.");document.getElementById("fTitle").focus();return;}
  const startDate=document.getElementById("fStart").value;
  const endDate=document.getElementById("fEnd").value;
  if(startDate&&endDate&&startDate>endDate){toast("시작일이 종료일보다 늦습니다.");return;}
  const reminderAt=document.getElementById("fReminder").value;
  const memo=document.getElementById("fMemo").value.trim();
  let imageDataUrl=null;
  if(currentImageDataUrl) imageDataUrl=currentImageDataUrl;
else if(editingId&&!imageCleared){const old=tasks.find(x=>x.id===editingId);if(old) imageDataUrl=old.imageDataUrl||null;}


  if(editingId){
    const old=tasks.find(x=>x.id===editingId);
    await idbPut({...old,title,memo,startDate,endDate,reminderAt,imageDataUrl,
      reminded:old.reminderAt!==reminderAt?false:(old.reminded||false)});
    toast("항목이 수정되었습니다.");
  } else {
    const id=(typeof crypto!=="undefined"&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString();
    await idbPut({id,title,memo,startDate,endDate,reminderAt,reminded:false,done:false,createdAt:Date.now(),imageDataUrl});
    toast("항목이 추가되었습니다.");
  }
  resetForm();await refresh();
if(currentView==='calendar') renderCalendar();
}

/* ★ getFiltered — 정렬 포함 */
function getFiltered(){
  const y=Number(document.getElementById("filterYear").value);
  const m=Number(document.getElementById("filterMonth").value);
  const fs=parseDateOnly(document.getElementById("filterStart").value);
  const fe=parseDateOnly(document.getElementById("filterEnd").value);
  const status=document.getElementById("filterStatus").value;
  const sort=document.getElementById("filterSort").value;

  let ms=null,me=null;
  if(m!==0){ms=new Date(y,m-1,1);me=new Date(y,m,0,23,59,59);}

  const filtered=tasks.filter(t=>{
    const ts=parseDateOnly(t.startDate)||parseDateOnly(t.endDate);
    const te=parseDateOnly(t.endDate)||parseDateOnly(t.startDate);
    if(m!==0&&ts&&!overlap(ts,te,ms,me)) return false;
    if((fs||fe)&&ts&&!overlap(ts,te,fs,fe)) return false;
    if(status==="todo"&&t.done) return false;
    if(status==="done"&&!t.done) return false;
    return true;
  });

  filtered.sort((a,b)=>{
    const da=a.endDate||a.startDate||null;
    const db=b.endDate||b.startDate||null;
    if(da&&db) return sort==="asc"?da.localeCompare(db):db.localeCompare(da);
    if(da) return -1;
    if(db) return 1;
    return sort==="asc"?(a.createdAt||0)-(b.createdAt||0):(b.createdAt||0)-(a.createdAt||0);
  });

  return filtered;
}

function resetFilter(){
  const now=new Date();
  document.getElementById("filterYear").value=now.getFullYear();
  document.getElementById("filterMonth").value=now.getMonth()+1;
  document.getElementById("filterStart").value="";
  document.getElementById("filterEnd").value="";
  document.getElementById("filterStatus").value="all";
  document.getElementById("filterSort").value="asc";
  filterList();
}
function filterList(){render(getFiltered());}

function selectAllFiltered(){getFiltered().forEach(t=>selectedIds.add(t.id));filterList();}
function clearSelection(){selectedIds.clear();filterList();}
async function bulkDone(){
  if(!selectedIds.size){toast("선택된 항목이 없습니다.");return;}
  const cnt=selectedIds.size;
  for(const id of selectedIds){const t=tasks.find(x=>x.id===id);if(t){t.done=true;t.reminded=true;await idbPut(t);}}
  clearSelection();await refresh();toast(cnt+"개 항목 완료 처리되었습니다.");
}
async function bulkDelete(){
  if(!selectedIds.size){toast("선택된 항목이 없습니다.");return;}
  if(!confirm("선택한 "+selectedIds.size+"개를 삭제할까요?")) return;
  const cnt=selectedIds.size;
  for(const id of selectedIds) await idbDel(id);
  clearSelection();await refresh();toast(cnt+"개 항목이 삭제되었습니다.");
}

function render(filtered){
  const list=document.getElementById("taskList");
  list.innerHTML="";
  document.getElementById("statTotal").textContent=tasks.length;
  document.getElementById("statDone").textContent=tasks.filter(t=>t.done).length;
  document.getElementById("statRemain").textContent=tasks.filter(t=>!t.done).length;
  document.getElementById("bulkInfo").textContent=selectedIds.size+"개 선택됨";

  if(filtered.length===0){
    list.innerHTML='<div class="empty-state"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 12l2 2 4-4"/></svg><div>표시할 항목이 없습니다.</div></div>';
    return;
  }

  filtered.forEach(t=>{
    const isOver=isOverdue(t);
    const sCls=t.done?"badge-done":(isOver?"badge-over":"badge-todo");
    const sTxt=t.done?"완료":(isOver?"기한초과":"진행중");
    const imgHtml=t.imageDataUrl?'<img class="task-thumb" src="'+t.imageDataUrl+'" onclick="openLightbox(this.src)" title="클릭하면 크게 보기" />':"";
    const period=(t.startDate||t.endDate)?'<span class="meta-tag period">&#128197; '+fmtDate(t.startDate)+' ~ '+fmtDate(t.endDate)+'</span>':"";
    const rem=t.reminderAt?'<span class="meta-tag rem">&#9200; '+t.reminderAt.replace("T"," ")+'</span>':"";
    const memoHtml=t.memo?'<div class="task-memo">'+escHtml(t.memo)+'</div>':"";
    const chk1=selectedIds.has(t.id)?"checked":"";
    const chk2=t.done?"checked":"";

    const div=document.createElement("div");
    div.className="task-card"+(t.done?" done-card":"")+(selectedIds.has(t.id)?" selected-card":"");
    div.innerHTML=
      '<div class="task-chk-wrap">'+
        '<input type="checkbox" title="선택" '+chk1+' onchange="toggleSelect(\''+t.id+'\',this.checked)" />'+
        '<input type="checkbox" title="완료" '+chk2+' onchange="toggleDone(\''+t.id+'\',this.checked)" style="accent-color:var(--success);" />'+
      '</div>'+
      '<div class="task-body">'+
        '<div class="task-title">📒'+escHtml(t.title)+'</div>'+
        '<div class="task-meta">'+period+rem+'</div>📝'+memoHtml+imgHtml+
        '<div class="task-actions">'+
          '<button class="btn btn-ghost btn-sm" onclick="fillForm(getTask(\''+t.id+'\'))">✏️수정</button>'+
          '<button class="btn btn-danger btn-sm" onclick="deleteOne(\''+t.id+'\')">🗑️삭제</button>'+
        '</div>'+
      '</div>'+
      '<div class="task-aside"><span class="badge '+sCls+'">'+sTxt+'</span></div>';
    list.appendChild(div);
  });
}

function toggleSelect(id,checked){
  if(checked) selectedIds.add(id); else selectedIds.delete(id);
  document.getElementById("bulkInfo").textContent=selectedIds.size+"개 선택됨";
  filterList();
}
async function toggleDone(id,checked){
  const t=tasks.find(x=>x.id===id); if(!t) return;
  t.done=checked; if(checked) t.reminded=true;
  await idbPut(t); await refresh();
}
async function deleteOne(id){
  if(!confirm("이 항목을 삭제할까요?")) return;
  await idbDel(id); selectedIds.delete(id); await refresh(); toast("항목이 삭제되었습니다.");
}


/* ── Shift Pattern ── */
// 패턴: [주,주,휴,휴,야,야,휴,휴] (8일 주기)
const SHIFT_PATTERN = ['주','주','휴','휴','야','야','휴','휴'];
// 기준일: 2026-03-26
const SHIFT_ANCHOR = new Date('2026-03-26T00:00:00');
// 각 파트별 3월26일 기준 사이클 오프셋
// 발전3파트=0(주), 발전2파트=2(휴), 발전1파트=4(야), 발전4파트=6(휴)
const SHIFT_OFFSETS = {'1':4, '2':2, '3':0, '4':6};

function getShiftForDate(ds, part) {
  if(!part) return null;
  const date = new Date(ds + 'T00:00:00');
  const anchor = SHIFT_ANCHOR;
  const diff = Math.round((date - anchor) / 86400000);
  const offset = SHIFT_OFFSETS[part] || 0;
  const idx = ((diff + offset) % 8 + 8) % 8;
  return SHIFT_PATTERN[idx];
}

function shiftBadgeHtml(shift) {
  if(!shift) return '';
  if(shift === '주') return '<span class="shift-badge shift-ju">주</span>';
  if(shift === '야') return '<span class="shift-badge shift-ya">야</span>';
  if(shift === '휴') return '<span class="shift-badge shift-hyu">휴</span>';
  return '';
}

/* ── Calendar ── */
const MNAMES=["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
const DNAMES=["일","월","화","수","목","금","토"];

function prevMonth(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendar();}
function nextMonth(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendar();}
function goToday(){calYear=new Date().getFullYear();calMonth=new Date().getMonth();renderCalendar();}

function getTasksForDay(ds){
  return tasks.filter(t=>{
    const s=t.startDate||t.endDate, e=t.endDate||t.startDate;
    if(!s&&!e) return false;
    return ds>=s&&ds<=e;
  });
}
function renderCalendar(){
  const y=calYear,m=calMonth;
  document.getElementById("calTitle").textContent=y+"년 "+MNAMES[m];
  const firstDow=new Date(y,m,1).getDay();
  const dim=new Date(y,m+1,0).getDate();
  const dipm=new Date(y,m,0).getDate();
  const today=todayStr();
  const grid=document.getElementById("calGrid");
  grid.innerHTML="";

  DNAMES.forEach((d,i)=>{
    const el=document.createElement("div");
    el.className="cal-dow"+(i===0?" dow-sun":i===6?" dow-sat":"");
    el.textContent=d; grid.appendChild(el);
  });

  const cells=[];
  for(let i=firstDow-1;i>=0;i--){
    const pm=m===0?11:m-1,py=m===0?y-1:y;
    cells.push({d:dipm-i,m:pm,y:py,other:true});
  }
  for(let d=1;d<=dim;d++) cells.push({d,m,y,other:false});
  const nm=m===11?0:m+1,ny=m===11?y+1:y;
  for(let d=1;cells.length<42;d++) cells.push({d,m:nm,y:ny,other:true});

  cells.forEach((cell,idx)=>{
    const ds=makeDateStr(cell.y,cell.m,cell.d);
    const dow=idx%7;
    const el=document.createElement("div");
    el.className="cal-cell"+(cell.other?" other-month":"")+(!cell.other&&ds===today?" today":"")+(dow===0?" dow-sun":dow===6?" dow-sat":"");
    if(!cell.other) el.onclick=()=>openDayModal(ds);

    const numRow=document.createElement("div");
    numRow.style.cssText="display:flex;align-items:center;gap:4px;margin-bottom:3px;";

    const num=document.createElement("div");
    num.className="cal-day-num"; num.textContent=cell.d;
    numRow.appendChild(num);

    if(!cell.other){
      const selPart=document.getElementById("calPartSelect").value;
      if(selPart){
        const shift=getShiftForDate(ds, selPart);
        if(shift){
          const sb=document.createElement("span");
          sb.innerHTML=shiftBadgeHtml(shift);
          numRow.appendChild(sb.firstChild);
        }
      }
    }
    el.appendChild(numRow);

    if(!cell.other){
      const dt=getTasksForDay(ds);
      dt.slice(0,3).forEach(t=>{
        const isOver=isOverdue(t);
        const chip=document.createElement("div");
        chip.className="cal-task-chip "+(t.done?"chip-done":(isOver?"chip-over":"chip-todo"));
        chip.textContent=t.title; chip.title=t.title;
        chip.onclick=e=>{e.stopPropagation();openDayModal(ds);};
        el.appendChild(chip);
      });
      if(dt.length>3){
        const more=document.createElement("div");
        more.className="cal-more"; more.textContent="+"+(dt.length-3)+"개 더";
        el.appendChild(more);
      }
    }
    grid.appendChild(el);
  });
}

function openDayModal(ds){
  dayModalDate=ds;
  const parts=ds.split("-");
  const dow=DNAMES[new Date(ds+"T00:00:00").getDay()];
  document.getElementById("dayModalTitle").textContent=parts[0]+"년 "+Number(parts[1])+"월 "+Number(parts[2])+"일 ("+dow+")";
  const body=document.getElementById("dayModalBody");
  const dt=getTasksForDay(ds);
  if(dt.length===0){
    body.innerHTML='<div class="day-modal-empty">이 날짜에 일정이 없습니다.</div>';
  } else {
    body.innerHTML=dt.map(t=>{
      const isOver=isOverdue(t);
      const bc=t.done?"badge-done":(isOver?"badge-over":"badge-todo");
      const bt=t.done?"완료":(isOver?"기한초과":"진행중");
      return '<div class="task-item '+(t.done?"done-item":"")+'">'+
        '<div class="task-item-body">'+
          '<div class="task-item-title">'+escHtml(t.title)+'</div>'+
          '<div class="task-item-meta">'+
            ((t.startDate||t.endDate)?"&#128197; "+fmtDate(t.startDate)+" ~ "+fmtDate(t.endDate):"")+'</div>'+
          (t.memo?'<div class="task-item-memo">&#128221; '+escHtml(t.memo)+'</div>':'')+
        '</div>'+
        '<div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end;">'+
          '<span class="badge '+bc+'">'+bt+'</span>'+
          '<button class="btn btn-ghost btn-sm" onclick="fillFormFromModal(\''+t.id+'\')">&#9998;</button>'+
        '</div></div>';
    }).join("");
  }
  document.getElementById("dayModalOverlay").classList.add("open");
}
function closeDayModal(){document.getElementById("dayModalOverlay").classList.remove("open");}
function fillFormFromModal(id){closeDayModal();fillForm(getTask(id));}
function openAddFromDay(){
  closeDayModal();resetForm();
  if(dayModalDate){
    document.getElementById("fStart").value=dayModalDate;
    document.getElementById("fEnd").value=dayModalDate;
  }
  window.scrollTo({top:0,behavior:"smooth"});
  document.getElementById("fTitle").focus();
}


/* ── Backup & Restore ── */
function backupData() {
  const data = lsLoad();
  if(!data.length) { toast('백업할 데이터가 없습니다.'); return; }
  const now = new Date();
  const stamp = now.getFullYear()
    + String(now.getMonth()+1).padStart(2,'0')
    + String(now.getDate()).padStart(2,'0')
    + '_'
    + String(now.getHours()).padStart(2,'0')
    + String(now.getMinutes()).padStart(2,'0');
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'todo_backup_' + stamp + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('백업 파일이 저장되었습니다. (' + data.length + '개 항목)');
}

async function restoreData(input) {
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const parsed = JSON.parse(e.target.result);
      if(!Array.isArray(parsed)) throw new Error('형식 오류');
      const existing = lsLoad();
      const existIds = new Set(existing.map(x => x.id));
      let added = 0, skipped = 0;
      for(const item of parsed) {
        if(!item.id || !item.title) { skipped++; continue; }
        if(existIds.has(item.id)) { skipped++; continue; }
        await idbPut(item);
        added++;
      }
      await refresh();
      toast('복원 완료: ' + added + '개 추가, ' + skipped + '개 중복/건너뜀');
    } catch(err) {
      toast('파일을 읽을 수 없습니다. 올바른 백업 파일인지 확인하세요.');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

async function refresh(){
  tasks=await idbAll();
  filterList();
  if(currentView==="calendar") renderCalendar();
}

(async()=>{
  buildYearSelect();
  const now=new Date();
  document.getElementById("filterMonth").value=now.getMonth()+1;
  document.getElementById("todayLabel").textContent=
    now.getFullYear()+"년 "+(now.getMonth()+1)+"월 "+now.getDate()+"일";
  updateNotiBanner();
  await refresh();
  setInterval(async()=>{await refresh();checkReminders();},30000);
})();
</script>
